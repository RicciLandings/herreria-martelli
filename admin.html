<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel · Herrería Martelli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#15140f;--paper:#ece6da;--deep:#dfd7c6;--steel:#2b2a26;--ember:#a8512b;--grey:#6f6a5c;--line:rgba(21,20,15,.14);--ok:#3d7a4f;--err:#a33}
  *{box-sizing:border-box;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;min-height:100svh}
  h1,h2{font-family:'Fraunces',serif;font-weight:600}
  button,input{font:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px}
  header{background:var(--steel);color:var(--paper)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
  header h1{font-size:1.1rem}
  header a,header button{color:var(--paper);background:none;border:1px solid rgba(236,230,218,.3);padding:7px 12px;font-size:.8rem;cursor:pointer;text-decoration:none}
  .demo{background:var(--ember);color:var(--paper);font-size:.82rem;padding:10px 20px;text-align:center}
  main{padding:28px 0 60px}
  .card{background:#f6f2ea;border:1px solid var(--line);padding:22px;margin-bottom:22px}
  .card h2{font-size:1.25rem;margin-bottom:16px}
  label{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);margin:14px 0 6px}
  input[type=text],input[type=email],input[type=password]{width:100%;padding:13px 14px;border:1px solid var(--line);background:#fff;font-size:16px}
  .btn{display:block;width:100%;margin-top:20px;height:50px;border:0;background:var(--ink);color:var(--paper);font-weight:500;cursor:pointer}
  .btn:disabled{opacity:.5}
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--grey);min-height:150px;padding:16px;cursor:pointer;text-align:center;color:var(--grey);background:#fff;position:relative;overflow:hidden}
  .drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .drop input{display:none}
  .drop strong{color:var(--ink)}
  .msg{margin-top:12px;font-size:.88rem;min-height:1.2em}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
  .list{display:grid;gap:10px}
  .item{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);padding:8px}
  .item img{width:72px;height:90px;object-fit:cover;flex:none;background:var(--deep)}
  .item .txt{flex:1;min-width:0}
  .item .txt b{display:block;font-weight:600}
  .item .txt span{color:var(--grey);font-size:.88rem}
  .item .acts{display:flex;flex-direction:column;gap:4px}
  .item .acts button{width:40px;height:30px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:.9rem}
  .item .acts button.del{color:var(--err)}
  .empty{color:var(--grey);font-size:.92rem}
  .hidden{display:none!important}
</style>
</head>
<body>

<header><div class="wrap">
  <h1>Panel del taller</h1>
  <div>
    <a href="index.html" target="_blank">Ver web</a>
    <button id="logout" class="hidden">Salir</button>
  </div>
</div></header>
<div class="demo hidden" id="demoBar">Modo demo: todavía no está conectada la base de datos. Lo que subas acá no se guarda.</div>

<main class="wrap">
  <!-- Login -->
  <section class="card" id="loginView">
    <h2>Ingresar</h2>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="pass">Contraseña</label>
      <input type="password" id="pass" required autocomplete="current-password">
      <button class="btn" type="submit">Entrar</button>
      <p class="msg" id="loginMsg"></p>
    </form>
  </section>

  <!-- Panel -->
  <div id="panelView" class="hidden">
    <section class="card">
      <h2>Subir un trabajo</h2>
      <form id="upForm">
        <label class="drop" id="drop">
          <input type="file" id="file" accept="image/*" required>
          <strong>Tocá para elegir una foto</strong>
          <span>o sacala con la cámara</span>
          <img id="preview" class="hidden" alt="">
        </label>
        <label for="titulo">Tipo de trabajo</label>
        <input type="text" id="titulo" placeholder="Ej: Pérgola, Portón, Reja" required list="tipos">
        <datalist id="tipos"><option>Pérgola</option><option>Portón</option><option>Reja</option><option>Aberturas</option><option>Escalera</option></datalist>
        <label for="detalle">Detalle (opcional)</label>
        <input type="text" id="detalle" placeholder="Ej: Terraza en Palermo">
        <button class="btn" type="submit" id="upBtn">Publicar en la web</button>
        <p class="msg" id="upMsg"></p>
      </form>
    </section>

    <section class="card">
      <h2>Fotos publicadas</h2>
      <div class="list" id="list"></div>
    </section>
  </div>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const cfg = window.MARTELLI_CONFIG || {};
const DEMO = !cfg.supabaseUrl || !cfg.supabaseKey;
const $ = id => document.getElementById(id);
const msg = (el, text, type='') => { el.textContent = text; el.className = 'msg ' + type; };

// ---------- capa de datos (Supabase o demo en memoria) ----------
let api;
if (DEMO) {
  $('demoBar').classList.remove('hidden');
  let rows = [
    {id:'1', titulo:'Pérgola', detalle:'Terraza', url:'images/pergola-terraza.jpg', orden:0},
    {id:'2', titulo:'Pérgola', detalle:'Vista urbana', url:'images/pergola-urbana.jpg', orden:1},
    {id:'3', titulo:'Aberturas', detalle:'Hierro y vidrio', url:'images/puerta-vidrio.jpg', orden:2},
  ];
  api = {
    session: async () => false,
    login: async () => {},
    logout: async () => {},
    list: async () => [...rows].sort((a,b)=>a.orden-b.orden),
    add: async (blob, titulo, detalle) => {
      rows.forEach(r => r.orden++);
      rows.push({id:String(Date.now()), titulo, detalle, url:URL.createObjectURL(blob), orden:0});
    },
    remove: async r => { rows = rows.filter(x => x.id !== r.id); },
    setOrder: async (r, orden) => { rows.find(x => x.id === r.id).orden = orden; },
  };
} else {
  const sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  const pub = path => sb.storage.from('trabajos').getPublicUrl(path).data.publicUrl;
  const check = ({error}) => { if (error) throw error; };
  api = {
    session: async () => !!(await sb.auth.getSession()).data.session,
    login: async (email, password) => check(await sb.auth.signInWithPassword({email, password})),
    logout: async () => sb.auth.signOut(),
    list: async () => {
      const {data, error} = await sb.from('trabajos').select('*').order('orden').order('created_at', {ascending:false});
      if (error) throw error;
      return data.map(r => ({...r, url: pub(r.foto_path)}));
    },
    add: async (blob, titulo, detalle) => {
      const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      check(await sb.storage.from('trabajos').upload(path, blob, {contentType:'image/jpeg'}));
      const {data} = await sb.from('trabajos').select('orden').order('orden').limit(1);
      const orden = data && data.length ? data[0].orden - 1 : 0;   // queda primera
      check(await sb.from('trabajos').insert({titulo, detalle: detalle || null, foto_path: path, orden}));
    },
    remove: async r => {
      check(await sb.from('trabajos').delete().eq('id', r.id));
      await sb.storage.from('trabajos').remove([r.foto_path]);
    },
    setOrder: async (r, orden) => check(await sb.from('trabajos').update({orden}).eq('id', r.id)),
  };
}

// ---------- achicar foto del celular antes de subir (máx 1600px, JPG) ----------
async function shrink(file, max = 1600) {
  const img = await createImageBitmap(file, {imageOrientation:'from-image'}).catch(() => null);
  if (!img) return file;
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
}

// ---------- vistas ----------
function show(logged) {
  $('loginView').classList.toggle('hidden', logged);
  $('panelView').classList.toggle('hidden', !logged);
  $('logout').classList.toggle('hidden', !logged);
  if (logged) render();
}

async function render() {
  const list = $('list');
  try {
    const rows = await api.list();
    list.innerHTML = rows.length ? '' : '<p class="empty">Todavía no hay fotos. La web muestra las fotos de ejemplo.</p>';
    rows.forEach((r, i) => {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `<img alt=""><div class="txt"><b></b><span></span></div>
        <div class="acts"><button title="Subir">↑</button><button title="Bajar">↓</button><button class="del" title="Borrar">✕</button></div>`;
      el.querySelector('img').src = r.url;
      el.querySelector('b').textContent = r.titulo;
      el.querySelector('span').textContent = r.detalle || '';
      const [up, down, del] = el.querySelectorAll('button');
      up.disabled = i === 0; down.disabled = i === rows.length - 1;
      const swap = async j => {
        const a = rows[i], b = rows[j];
        // renumerar todo para evitar empates
        await Promise.all(rows.map((x, k) => api.setOrder(x, x === a ? j : x === b ? i : k)));
        render();
      };
      up.onclick = () => swap(i - 1);
      down.onclick = () => swap(i + 1);
      del.onclick = async () => {
        if (!confirm(`¿Borrar "${r.titulo}" de la web?`)) return;
        await api.remove(r); render();
      };
      list.appendChild(el);
    });
  } catch (e) {
    list.innerHTML = '<p class="msg err">No se pudieron cargar las fotos: ' + e.message + '</p>';
  }
}

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  msg($('loginMsg'), 'Entrando…');
  try { await api.login($('email').value.trim(), $('pass').value); show(true); }
  catch { msg($('loginMsg'), 'Email o contraseña incorrectos.', 'err'); }
};
$('logout').onclick = async () => { await api.logout(); show(false); };

$('file').onchange = () => {
  const f = $('file').files[0];
  const p = $('preview');
  if (f) { p.src = URL.createObjectURL(f); p.classList.remove('hidden'); }
};

$('upForm').onsubmit = async e => {
  e.preventDefault();
  const f = $('file').files[0];
  if (!f) return;
  $('upBtn').disabled = true;
  msg($('upMsg'), 'Subiendo foto…');
  try {
    await api.add(await shrink(f), $('titulo').value.trim(), $('detalle').value.trim());
    msg($('upMsg'), '¡Listo! Ya está en la web.', 'ok');
    e.target.reset(); $('preview').classList.add('hidden');
    render();
  } catch (err) {
    msg($('upMsg'), 'No se pudo subir: ' + err.message, 'err');
  }
  $('upBtn').disabled = false;
};

api.session().then(show);
</script>
</body>
</html>
