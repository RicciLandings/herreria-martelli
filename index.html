<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Herrería Martelli — Hierro trabajado a medida</title>
<meta name="description" content="Herrería Martelli, Zona Norte, Vicente López. Diseño, fabricación e instalación de pérgolas, portones, rejas y aberturas de hierro a medida.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15140f; --paper:#ece6da; --paper-deep:#dfd7c6; --steel:#2b2a26; --ember:#a8512b; --grey:#6f6a5c;
    --line: color-mix(in srgb, var(--ink) 14%, transparent);
    --line-light: color-mix(in srgb, var(--paper) 22%, transparent);
    --font:"Archivo","Helvetica Neue",Arial,sans-serif; --hw:600;
    --cols:3; --ratio:4/5; --gap:1; --hero-h:100;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--font); font-weight:400; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--font); font-weight:var(--hw); margin:0; line-height:1.05; letter-spacing:-0.015em;}
  a{color:inherit; text-decoration:none;}
  img{display:block; max-width:100%;}
  [data-k]{white-space:pre-line;}
  .eyebrow{font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--grey); font-weight:500;}

  .grid-mark{display:inline-flex; flex-wrap:wrap; gap:3px; width:22px; height:22px;}
  .grid-mark span{width:8px; height:8px; background:currentColor; opacity:0.85;}

  /* ---------- nav ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:55;
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 6vw; color:var(--paper);
    transition:background .35s ease, color .35s ease, padding .35s ease, box-shadow .35s ease;
  }
  header.solid{background:var(--paper); color:var(--ink); padding:14px 6vw; box-shadow:0 1px 0 var(--line);}
  .brand{font-size:1.1rem; font-weight:700; letter-spacing:0.01em;}
  nav{display:flex; gap:34px;}
  nav a{font-size:0.82rem; letter-spacing:0.04em; position:relative; padding-bottom:4px;}
  nav a::after{content:""; position:absolute; left:0; right:100%; bottom:0; height:1px; background:currentColor; transition:right .3s ease;}
  nav a:hover::after{right:0;}
  .nav-toggle,.nav-backdrop,.wa-float{display:none;}

  /* ---------- hero ---------- */
  .hero{
    position:relative; height:calc(var(--hero-h) * 1vh); height:calc(var(--hero-h) * 1svh); min-height:460px;
    display:flex; align-items:flex-end; overflow:hidden; background:var(--steel); padding:0;
  }
  .hero-img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:saturate(.92) contrast(1.02);}
  .hero::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(18,17,13,.18) 0%, rgba(18,17,13,.12) 35%, rgba(18,17,13,.86) 100%);}
  .hero-content{position:relative; z-index:2; color:var(--paper); padding:0 6vw calc(9vh * var(--py,1)); max-width:820px;}
  .hero-content .eyebrow{color:var(--paper); opacity:.75; margin-bottom:18px; display:flex; align-items:center; gap:10px;}
  .hero h1{font-size:clamp(2.6rem, 6.4vw, 5rem);}
  .hero p{margin:22px 0 0; font-size:1.05rem; font-weight:300; max-width:480px; opacity:.88;}
  .cta{
    display:inline-flex; align-items:center; gap:12px; margin-top:34px; padding:15px 28px;
    border:1px solid var(--paper); color:var(--paper); font-size:.85rem; letter-spacing:.04em;
    transition:background .3s ease, color .3s ease, border-color .3s ease;
  }
  .cta:hover{background:var(--ember); border-color:var(--ember);}
  .cta-hero{background:var(--ember); border-color:var(--ember); margin-top:28px;}
  .cta-hero:hover{background:transparent; border-color:var(--paper);}

  /* ---------- secciones ---------- */
  section{padding:calc(120px * var(--py,1)) 6vw;}
  .section-head{display:flex; align-items:baseline; gap:18px; margin-bottom:22px; flex-wrap:wrap;}
  .section-head h2{font-size:clamp(1.8rem, 3vw, 2.5rem);}
  .rule{flex:1; height:1px; background:var(--line); min-width:60px;}

  /* ---------- trabajos ---------- */
  .gallery{background:var(--paper);}
  .services-line{margin:0 0 36px; font-size:1.05rem; color:var(--grey); letter-spacing:.02em;}
  .filters{display:flex; flex-wrap:wrap; gap:10px; margin:0 0 36px;}
  .filters[hidden]{display:none;}
  .chip{
    font-family:var(--font); font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; font-weight:500;
    padding:11px 20px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--grey);
    cursor:pointer; transition:background .5s ease, color .5s ease, border-color .5s ease; white-space:nowrap;
  }
  .chip:hover{color:var(--ink); border-color:color-mix(in srgb, var(--ink) 40%, transparent);}
  .chip.on{background:var(--ink); border-color:var(--ink); color:var(--paper);}
  .gallery-grid{display:grid; grid-template-columns:repeat(var(--cols), 1fr); gap:calc(28px * var(--gap));}
  .gallery-grid.carousel{
    display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;
    margin:0 -6vw; padding:0 6vw 8px;
  }
  .gallery-grid.carousel::-webkit-scrollbar{display:none;}
  .gallery-grid.carousel figure{flex:0 0 calc((100% - (var(--cols) - 1) * 28px * var(--gap)) / var(--cols)); scroll-snap-align:start;}
  figure{margin:0;}
  .work{cursor:zoom-in; outline-offset:4px;}
  .work{transition:opacity .5s ease, transform .5s ease;}
  .work.leaving{opacity:0; transform:translateY(-8px); pointer-events:none;}
  .work.pop{animation:pop 1.5s cubic-bezier(.22,1,.36,1) both;}
  @keyframes pop{from{opacity:0; transform:translateY(16px) scale(.985);} to{opacity:1; transform:none;}}
  .frame{position:relative; overflow:hidden; aspect-ratio:var(--ratio); background:var(--steel);}
  .frame img{width:100%; height:100%; object-fit:cover; transition:transform .6s ease;}
  .work:hover .frame img{transform:scale(1.04);}
  .frame .panes{position:absolute; inset:0; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(4,1fr); pointer-events:none;}
  .frame .panes span{border:1px solid rgba(236,230,218,0); transition:border-color .5s ease;}
  .work:hover .frame .panes span{border-color:rgba(236,230,218,.55);}
  figcaption{margin-top:14px; font-size:.85rem; color:var(--grey); display:flex; justify-content:space-between;}
  figcaption .tag{color:var(--ink); font-weight:500; font-size:.72rem; letter-spacing:.16em; text-transform:uppercase;}
  .gallery-note{margin:40px 0 0; font-size:.82rem; color:var(--grey); border-top:1px solid var(--line); padding-top:18px;}
  .gallery-empty{color:var(--grey);}

  /* ---------- sobre el taller ---------- */
  .about{background:var(--paper-deep); display:grid; grid-template-columns:1fr 1fr; gap:0 80px; align-items:start;}
  .about .section-head.full{grid-column:1 / -1; margin-bottom:40px;}
  .about-zone{margin:0; font-size:clamp(1.6rem, 2.6vw, 2.2rem); font-weight:var(--hw); line-height:1.15; color:var(--ink);}
  .about-text p{margin:0; font-size:1.08rem; line-height:1.75; color:var(--steel); font-weight:300; max-width:520px;}
  .about-text p + p{margin-top:18px;}

  /* ---------- contacto ---------- */
  .contact{background:var(--steel); color:var(--paper);}
  .contact .section-head{margin-bottom:54px;}
  .contact .section-head h2{color:var(--paper);}
  .contact .rule{background:var(--line-light);}
  .contact-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:80px;}
  .contact p.lead{margin:0; font-size:1.3rem; font-weight:300; line-height:1.55; max-width:460px; opacity:.92;}
  .contact-list{list-style:none; margin:0; padding:0;}
  .contact-list li{padding:20px 0; border-bottom:1px solid var(--line-light); display:flex; justify-content:space-between; gap:20px; font-size:.95rem;}
  .contact-list li:first-child{border-top:1px solid var(--line-light);}
  .contact-list .label{color:color-mix(in srgb, var(--paper) 55%, transparent); font-size:.78rem; letter-spacing:.06em; text-transform:uppercase;}
  .contact-list a{word-break:break-word;}
  .contact-list a:hover{color:var(--ember);}

  footer{background:var(--ink); color:var(--paper); padding:30px 6vw; display:flex; justify-content:space-between; align-items:center; font-size:.78rem; flex-wrap:wrap; gap:10px;}
  footer span{opacity:.7;}

  /* ---------- visor de fotos ---------- */
  body.modal-open{overflow:hidden;}
  .lightbox[hidden]{display:none;}
  .lightbox{position:fixed; inset:0; z-index:90; background:rgba(12,12,10,.96);}
  .lb-track{display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;}
  .lb-track::-webkit-scrollbar{display:none;}
  .lb-slide{flex:0 0 100%; height:100%; scroll-snap-align:center; display:flex; align-items:center; justify-content:center; padding:60px 4vw;}
  .lb-slide img{max-width:100%; max-height:100%; object-fit:contain;}
  .lb-btn,.lb-close{position:absolute; background:rgba(255,255,255,.1); color:#fff; border:0; cursor:pointer; width:48px; height:48px; font-size:1.6rem;}
  .lb-prev{left:16px; top:50%; transform:translateY(-50%);}
  .lb-next{right:16px; top:50%; transform:translateY(-50%);}
  .lb-close{top:14px; right:14px; font-size:1.1rem;}
  .lb-count{position:absolute; top:28px; left:20px; color:#fff; opacity:.7; font-size:.8rem; letter-spacing:.1em;}

  /* ---------- animación de entrada ---------- */
  .reveal{opacity:0; transform:translateY(18px); transition:opacity 1.6s cubic-bezier(.22,1,.36,1) var(--d,0s), transform 1.8s cubic-bezier(.22,1,.36,1) var(--d,0s); will-change:opacity, transform;}
  .reveal.in{opacity:1; transform:none;}
  .hero-content .reveal{transform:translateY(24px);}
  .hero-img{animation:heroIn 2.8s cubic-bezier(.22,1,.36,1) both;}
  @keyframes heroIn{from{opacity:0; transform:scale(1.05);} to{opacity:1; transform:none;}}
  body.editing .hero-img{animation:none;}

  /* ---------- modo edición (panel) ---------- */
  body.editing [data-k]{outline:1px dashed transparent; outline-offset:2px; cursor:text; border-radius:2px;}
  body.editing [data-k]:hover{outline-color:color-mix(in srgb, var(--ember) 70%, transparent);}
  body.editing [data-k]:focus{outline:2px solid var(--ember); background:color-mix(in srgb, var(--ember) 10%, transparent);}
  body.editing .hero-img{cursor:pointer;}

  /* ---------- responsive ---------- */
  @media (max-width:880px){
    nav{
      position:fixed; top:0; right:0; height:100vh; height:100dvh; width:72vw; max-width:320px;
      background:var(--ink); color:var(--paper); flex-direction:column; justify-content:center; gap:30px; padding:0 40px;
      transform:translateX(100%); transition:transform .4s ease;
    }
    nav.open{transform:translateX(0);}
    nav a{font-size:1.6rem; font-weight:500; padding:6px 0;}
    .nav-toggle{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; width:44px; height:44px; margin-right:-10px;
      cursor:pointer; background:none; border:none; padding:6px; z-index:60; color:inherit;}
    .nav-toggle span{width:22px; height:2px; background:currentColor; transition:transform .3s ease, opacity .3s ease;}
    body.menu-open .nav-toggle{color:var(--paper);}
    body.menu-open .nav-toggle span:nth-child(1){transform:translateY(7px) rotate(45deg);}
    body.menu-open .nav-toggle span:nth-child(2){opacity:0;}
    body.menu-open .nav-toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
    body.menu-open{overflow:hidden;}
    .nav-backdrop{display:block; position:fixed; inset:0; z-index:40; background:rgba(21,20,15,.5); opacity:0; pointer-events:none; transition:opacity .3s ease;}
    body.menu-open .nav-backdrop{opacity:1; pointer-events:auto;}
    .about,.contact-grid{grid-template-columns:1fr; gap:28px;}
    .contact-grid{gap:50px;}
    .gallery-grid{grid-template-columns:repeat(min(var(--cols), 2), 1fr); gap:calc(18px * var(--gap));}
    section{padding:calc(80px * var(--py,1)) 6vw;}
  }
  @media (max-width:560px){
    header{padding:14px 20px;}
    header.solid{padding:10px 20px;}
    section{padding:calc(64px * var(--py,1)) 20px;}
    .section-head{gap:12px; margin-bottom:16px;}
    .services-line{margin-bottom:28px; font-size:1rem;}
    .hero{min-height:520px;}
    .hero-content{padding:0 20px calc(110px * var(--py,1));}
    .hero h1{font-size:2.4rem;}
    .hero p{font-size:1rem; margin-top:16px;}
    .cta{display:flex; justify-content:center; width:100%; padding:16px;}
    .about-text p{font-size:1rem; line-height:1.7;}
    .gallery-grid.carousel{margin:0 -20px; padding:0 20px 8px; gap:14px;}
    .gallery-grid.carousel figure{flex:0 0 82%; scroll-snap-align:center;}
    .gallery-grid:not(.carousel){gap:14px;}
    .gallery-grid:not(.carousel) figcaption{margin-top:8px;}
    .contact p.lead{font-size:1.12rem;}
    .contact .section-head{margin-bottom:32px;}
    .contact-list li{flex-direction:column; gap:4px; padding:16px 0;}
    footer{flex-direction:column; align-items:flex-start; padding:24px 20px calc(90px + env(safe-area-inset-bottom));}
    .filters{flex-wrap:nowrap; overflow-x:auto; margin:0 -20px 24px; padding:0 20px 4px; scrollbar-width:none;}
    .filters::-webkit-scrollbar{display:none;}
    .chip{padding:10px 16px;}
    .lb-btn{display:none;}
    .wa-float{
      display:flex; align-items:center; justify-content:center;
      position:fixed; left:16px; right:16px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:45;
      height:52px; background:var(--ember); color:var(--paper); font-size:.92rem; font-weight:500; letter-spacing:.02em;
      box-shadow:0 8px 24px rgba(0,0,0,.25); transform:translateY(140%); transition:transform .35s ease;
    }
    .wa-float.show{transform:none;}
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{transition:none !important; animation:none !important;}
    .reveal{opacity:1; transform:none;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="config.js"></script>
<script src="store.js"></script>
<script src="site.js"></script>
<script>
  // En el panel (?edit=1) la página la controla el editor; si no, carga lo publicado.
  if (!/[?&]edit=1/.test(location.search)) Site.load();
</script>
</body>
</html>
