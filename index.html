<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Herrería Martelli — Hierro trabajado a medida</title>
<meta name="description" content="Herrería Martelli, Zona Norte, Vicente López. Diseño, fabricación e instalación de pérgolas, portones, rejas y aberturas de hierro a medida.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e0d0a; --paper:#efe9de; --paper-deep:#e2d9c8; --steel:#1c1b17; --ember:#a5461f; --grey:#57524a;
    --line: color-mix(in srgb, var(--ink) 18%, transparent);
    --line-light: color-mix(in srgb, var(--paper) 22%, transparent);
    --font:"Archivo","Helvetica Neue",Arial,sans-serif; --hw:600;
    --cols:3; --ratio:4/5; --gap:1; --hero-h:100;
    --ease:cubic-bezier(.25,.46,.45,.94); --ease-io:cubic-bezier(.45,0,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--font); font-weight:400; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--font); font-weight:var(--hw); margin:0; line-height:1.05; letter-spacing:-0.015em;}
  a{color:inherit; text-decoration:none;}
  img{display:block; max-width:100%;}
  [data-k]{white-space:pre-line;}
  .eyebrow{font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--grey); font-weight:500;}

  .grid-mark{display:inline-flex; flex-wrap:wrap; gap:3px; width:22px; height:22px;}
  .grid-mark span{width:8px; height:8px; background:currentColor; opacity:0.85;}

  /* ---------- nav ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:55;
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 6vw; color:var(--paper);
    transition:background .7s var(--ease), color .7s var(--ease), padding .7s var(--ease), box-shadow .7s var(--ease), transform .8s var(--ease-out);
  }
  header.away{transform:translate3d(0, -100%, 0);}
  body.editing header.away{transform:none;}
  header.solid{background:color-mix(in srgb, var(--paper) 88%, transparent); -webkit-backdrop-filter:blur(14px) saturate(1.2); backdrop-filter:blur(14px) saturate(1.2); color:var(--ink); padding:14px 6vw; box-shadow:0 1px 0 var(--line);}
  .brand{font-size:1.1rem; font-weight:700; letter-spacing:0.01em;}
  nav{display:flex; gap:34px;}
  nav a{font-size:0.82rem; letter-spacing:0.04em; position:relative; padding-bottom:4px;}
  nav a::after{content:""; position:absolute; left:0; right:100%; bottom:0; height:1px; background:currentColor; transition:right .6s var(--ease-out);}
  nav a:hover::after{right:0;}
  .nav-toggle,.nav-backdrop,.wa-float{display:none;}

  /* ---------- hero ---------- */
  .hero{
    position:relative; z-index:0; height:calc(var(--hero-h) * 1vh); height:calc(var(--hero-h) * 1svh); min-height:460px;
    display:flex; align-items:flex-end; overflow:hidden; background:var(--steel); padding:0;
  }
  #app > section:not(.hero), #app > footer{position:relative; z-index:1;}
  .hero-media{position:absolute; inset:-6% 0 0; overflow:hidden; will-change:transform; animation:heroIn 2.4s var(--ease-io) both;}
  .hero-img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; filter:saturate(.95) contrast(1.06);
    transition:opacity 2.6s var(--ease-io);}
  .hero-img.on{opacity:1;}
  .hero-img.on,.hero-img.off{animation:kb 13s linear both;}
  .hero-img:nth-child(even).on,.hero-img:nth-child(even).off{animation-name:kb2;}
  @keyframes heroIn{from{opacity:0;} to{opacity:1;}}
  @keyframes kb{from{transform:scale(1.02);} to{transform:scale(1.1) translate3d(-1.5%, -1%, 0);}}
  @keyframes kb2{from{transform:scale(1.1) translate3d(1.5%, -1%, 0);} to{transform:scale(1.02);}}
  .hero::before{content:""; position:absolute; inset:0; z-index:1; pointer-events:none; background:#000; opacity:var(--shade, 0);}
  .hero::after{content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(180deg, rgba(10,9,7,.42) 0%, rgba(10,9,7,.08) 30%, rgba(10,9,7,.18) 55%, rgba(10,9,7,.9) 100%);}
  .hero-content{position:relative; z-index:2; color:var(--paper); padding:0 6vw calc(9vh * var(--py,1)); max-width:860px; will-change:transform, opacity;}
  .hero-content .eyebrow{color:var(--paper); opacity:.85; margin-bottom:20px; display:flex; align-items:center; gap:10px;}
  .hero h1{font-size:clamp(2.6rem, 6.4vw, 5rem); text-shadow:0 2px 30px rgba(0,0,0,.18);}
  .hero p{margin:22px 0 0; font-size:1.05rem; font-weight:400; max-width:480px; opacity:.92;}
  .cta{
    display:inline-flex; align-items:center; gap:12px; margin-top:34px; padding:15px 28px;
    border:1px solid var(--paper); color:var(--paper); font-size:.85rem; letter-spacing:.04em;
    transition:background .6s var(--ease), color .6s var(--ease), border-color .6s var(--ease);
  }
  .cta:hover{background:var(--ember); border-color:var(--ember);}
  .cta-hero{background:var(--ember); border-color:var(--ember); margin-top:28px;}
  .cta-hero:hover{background:var(--paper); border-color:var(--paper); color:var(--ink);}

  /* ---------- secciones ---------- */
  section{padding:calc(120px * var(--py,1)) 6vw;}
  .section-head{display:flex; align-items:baseline; gap:18px; margin-bottom:22px; flex-wrap:wrap;}
  .section-head h2{font-size:clamp(1.8rem, 3vw, 2.5rem);}
  .rule{flex:1; height:1px; background:var(--line); min-width:60px;}

  /* ---------- trabajos ---------- */
  .gallery{background:var(--paper);}
  .services-line{margin:0 0 36px; font-size:1.05rem; color:var(--grey); letter-spacing:.02em;}
  .filters{display:flex; flex-wrap:wrap; gap:10px; margin:0 0 36px;}
  .filters[hidden]{display:none;}
  .chip{
    font-family:var(--font); font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; font-weight:500;
    padding:11px 20px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--grey);
    cursor:pointer; transition:background .6s var(--ease), color .6s var(--ease), border-color .6s var(--ease); white-space:nowrap;
  }
  .chip:hover{color:var(--ink); border-color:color-mix(in srgb, var(--ink) 40%, transparent);}
  .chip.on{background:var(--ink); border-color:var(--ink); color:var(--paper);}
  .gallery-grid{display:grid; grid-template-columns:repeat(var(--cols), 1fr); gap:calc(28px * var(--gap));}
  .gallery-grid.carousel{
    display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;
    margin:0 -6vw; padding:0 6vw 8px;
  }
  .gallery-grid.carousel::-webkit-scrollbar{display:none;}
  .gallery-grid.carousel figure{flex:0 0 calc((100% - (var(--cols) - 1) * 28px * var(--gap)) / var(--cols)); scroll-snap-align:start;}
  figure{margin:0;}
  .work{outline-offset:4px;}
  .work{transition:opacity .32s var(--ease-io), transform .32s var(--ease-io);}
  .work.leaving{opacity:0; transform:translateY(-4px); pointer-events:none;}
  .work.pop{animation:pop 1.6s var(--ease) both;}
  @keyframes pop{
    0%{opacity:0; transform:scale(1.04); filter:blur(10px);}
    60%{filter:blur(0);}
    100%{opacity:1; transform:none; filter:none;}
  }
  .frame{position:relative; display:block; width:100%; padding:0; border:0; overflow:hidden; aspect-ratio:var(--ratio); background:var(--steel); cursor:zoom-in;}
  .frame::after{content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg, transparent 55%, rgba(10,9,7,.38));
    opacity:0; transition:opacity .9s var(--ease);}
  .work:hover .frame::after{opacity:1;}
  .slides{display:flex; width:100%; height:100%; transition:transform 1.1s cubic-bezier(.65,0,.25,1);}
  .slide{flex:0 0 100%; width:100%; height:100%; overflow:hidden;}
  .slides img{width:100%; height:100%; object-fit:cover; opacity:0; transition:transform 1.6s var(--ease-out), opacity 1.2s var(--ease);}
  .slides img.ld{opacity:1;}
  .work:hover .slides img{transform:scale(1.03);}
  .frame-count{position:absolute; top:12px; right:12px; z-index:1; font-size:.68rem; letter-spacing:.12em; color:var(--paper);
    background:rgba(10,9,7,.45); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); padding:5px 9px; border-radius:999px;}
  figcaption{margin-top:14px; font-size:.85rem; color:var(--grey); display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .thumbs{display:flex; gap:6px;}
  .thumb{position:relative; width:34px; height:34px; padding:0; border:1px solid transparent; background:var(--paper-deep); cursor:pointer; overflow:hidden;
    opacity:.5; transition:opacity .6s var(--ease), border-color .6s var(--ease);}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .thumb:hover{opacity:.85;}
  .thumb.on{opacity:1; border-color:var(--ink);}
  .thumb i{position:absolute; left:0; bottom:0; height:2px; width:100%; background:var(--ember); transform-origin:left; animation:fill linear both;}
  @keyframes fill{from{transform:scaleX(0);} to{transform:scaleX(1);}}
  figcaption .tag{color:var(--ink); font-weight:500; font-size:.72rem; letter-spacing:.16em; text-transform:uppercase;}
  .gallery-note{margin:40px 0 0; font-size:.82rem; color:var(--grey); border-top:1px solid var(--line); padding-top:18px;}
  .gallery-empty{color:var(--grey);}

  /* ---------- sobre el taller ---------- */
  .about{background:var(--paper-deep); display:grid; grid-template-columns:1fr 1fr; gap:0 80px; align-items:start;}
  .about .section-head.full{grid-column:1 / -1; margin-bottom:40px;}
  .about-zone{margin:0; font-size:clamp(1.6rem, 2.6vw, 2.2rem); font-weight:var(--hw); line-height:1.15; color:var(--ink);}
  .about-text p{margin:0; font-size:1.08rem; line-height:1.75; color:color-mix(in srgb, var(--ink) 82%, transparent); font-weight:400; max-width:520px;}
  .about-text p + p{margin-top:18px;}

  /* ---------- contacto ---------- */
  .contact{background:var(--steel); color:var(--paper);}
  .contact .section-head{margin-bottom:54px;}
  .contact .section-head h2{color:var(--paper);}
  .contact .rule{background:var(--line-light);}
  .contact-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:80px;}
  .contact p.lead{margin:0; font-size:1.3rem; font-weight:400; line-height:1.55; max-width:460px; opacity:.94;}
  .contact-list{list-style:none; margin:0; padding:0;}
  .contact-list li{padding:20px 0; border-bottom:1px solid var(--line-light); display:flex; justify-content:space-between; gap:20px; font-size:.95rem;}
  .contact-list li:first-child{border-top:1px solid var(--line-light);}
  .contact-list .label{color:color-mix(in srgb, var(--paper) 55%, transparent); font-size:.78rem; letter-spacing:.06em; text-transform:uppercase;}
  .contact-list a{word-break:break-word;}
  .contact-list a:hover{color:var(--ember);}

  footer{background:var(--ink); color:var(--paper); padding:30px 6vw; display:flex; justify-content:space-between; align-items:center; font-size:.78rem; flex-wrap:wrap; gap:10px;}
  footer span{opacity:.7;}
  footer .credit{flex-basis:100%; align-self:stretch; padding-top:14px; margin-top:6px; border-top:1px solid color-mix(in srgb, var(--paper) 14%, transparent); font-size:.72rem; letter-spacing:.04em;}
  footer .credit a{border-bottom:1px solid color-mix(in srgb, var(--paper) 40%, transparent); transition:color .5s var(--ease), border-color .5s var(--ease);}
  footer .credit a:hover{color:var(--ember); border-color:var(--ember);}

  /* ---------- visor de fotos ---------- */
  body.modal-open{overflow:hidden;}
  .lightbox[hidden]{display:none;}
  .lightbox{position:fixed; inset:0; z-index:90; background:rgba(12,12,10,.96);}
  .lb-track{display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;}
  .lb-track::-webkit-scrollbar{display:none;}
  .lb-slide{flex:0 0 100%; height:100%; scroll-snap-align:center; display:flex; align-items:center; justify-content:center; padding:60px 4vw;}
  .lb-slide img{max-width:100%; max-height:100%; object-fit:contain;}
  .lb-btn,.lb-close{position:absolute; background:rgba(255,255,255,.1); color:#fff; border:0; cursor:pointer; width:48px; height:48px; font-size:1.6rem;}
  .lb-prev{left:16px; top:50%; transform:translateY(-50%);}
  .lb-next{right:16px; top:50%; transform:translateY(-50%);}
  .lb-close{top:14px; right:14px; font-size:1.1rem;}
  .lb-count{position:absolute; top:28px; left:20px; color:#fff; opacity:.7; font-size:.8rem; letter-spacing:.1em;}

  /* ---------- animación de entrada ---------- */
  /* textos: fundido corto con un desplazamiento mínimo */
  .reveal{opacity:0; transform:translateY(14px);
    transition:opacity 1.1s var(--ease-io) var(--d,0s), transform 1.4s var(--ease-out) var(--d,0s);}
  .reveal.in{opacity:1; transform:none;}
  /* títulos: cada palabra sube desde detrás de una máscara */
  .reveal.words{opacity:1; transform:none;}
  .reveal.words .w{display:inline-block; overflow:hidden; vertical-align:top; padding:0 .04em .14em 0; margin-bottom:-.14em;}
  .reveal.words .wi{display:inline-block; transform:translate3d(0, 112%, 0) rotate(4deg); transform-origin:0 100%;
    transition:transform 1.3s var(--ease-out) calc(var(--d,0s) + var(--wi,0) * .055s);}
  .reveal.words.in .wi{transform:none;}
  .section-head.reveal.words .eyebrow{opacity:0; transition:opacity 1s var(--ease-io) var(--d,0s);}
  .section-head.reveal.words.in .eyebrow{opacity:1;}
  .section-head .rule{transform-origin:left; transition:transform 1.8s var(--ease-out) calc(var(--d,0s) + .2s);}
  .section-head.reveal .rule{transform:scaleX(0);}
  .section-head.reveal.in .rule{transform:scaleX(1);}
  /* fotos de trabajos: aparecen con un mini zoom y desenfoque */
  .work.img-reveal{opacity:1; transform:none;}
  .work.img-reveal .frame{opacity:0; filter:blur(14px); transition:opacity 1.3s var(--ease-io) var(--d,0s), filter 1.5s var(--ease) var(--d,0s);}
  .work.img-reveal .slides{scale:1.08; transition:transform 1.1s cubic-bezier(.65,0,.25,1), scale 2s var(--ease-out) var(--d,0s);}
  .work.img-reveal figcaption{opacity:0; transition:opacity 1s var(--ease-io) calc(var(--d,0s) + .5s);}
  .work.img-reveal.in .frame{opacity:1; filter:none;}
  .work.img-reveal.in .slides{scale:1;}
  .work.img-reveal.in figcaption{opacity:1;}

  /* pantalla de inicio */
  body.intro-lock{overflow:hidden;}
  .intro{
    position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:var(--ink); color:var(--paper); text-align:center; padding:24px;
    transition:opacity 1.2s var(--ease-io), transform 1.3s var(--ease-io);
  }
  .intro.leave{opacity:0; transform:translateY(-2%); pointer-events:none;}
  .intro-in{display:flex; flex-direction:column; align-items:center;}
  .intro .grid-mark{color:var(--ember); opacity:0; transition:opacity 1.6s var(--ease-io) .2s;}
  .intro-title{
    margin:26px 0 0; font-size:clamp(2.2rem, 6vw, 4.4rem); font-weight:300; letter-spacing:.02em; color:var(--paper);
    opacity:0; transform:translateY(10px); filter:blur(8px);
    transition:opacity 1.8s var(--ease-io) .45s, transform 2.2s var(--ease) .45s, filter 1.8s var(--ease) .45s, letter-spacing 2.6s var(--ease) .45s;
  }
  .intro-line{display:block; width:64px; height:1px; margin:30px 0 34px; background:color-mix(in srgb, var(--paper) 40%, transparent);
    transform:scaleX(0); transition:transform 1.8s var(--ease-out) 1.2s;}
  .intro-btn{
    display:inline-flex; align-items:center; gap:14px; background:none; border:1px solid color-mix(in srgb, var(--paper) 35%, transparent);
    color:var(--paper); font-family:var(--font); font-size:.74rem; letter-spacing:.24em; text-transform:uppercase; padding:15px 30px; border-radius:999px;
    cursor:pointer; opacity:0; transform:translateY(8px);
    transition:opacity 1.4s var(--ease-io) 1.6s, transform 1.6s var(--ease) 1.6s, background .6s var(--ease), color .6s var(--ease), border-color .6s var(--ease);
  }
  .intro-btn i{font-style:normal; transition:transform .6s var(--ease-out);}
  .intro-btn:hover,.intro-btn:focus-visible{background:var(--paper); color:var(--ink); border-color:var(--paper); outline:none;}
  .intro-btn:hover i{transform:translateX(4px);}
  .intro.show .grid-mark{opacity:1;}
  .intro.show .intro-title{opacity:1; transform:none; filter:none; letter-spacing:.06em;}
  .intro.show .intro-line{transform:scaleX(1);}
  .intro.show .intro-btn{opacity:1; transform:none;}
  .intro.leave .intro-in{opacity:0; transform:translateY(-12px); transition:opacity .8s var(--ease-io), transform 1s var(--ease-io);}

  /* visor */
  .lightbox{animation:fadeIn .6s var(--ease) both;}
  .lb-slide img{animation:fadeIn .9s var(--ease) both;}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  body.editing .hero-img,body.editing .hero-media{animation:none;}
  body.editing .hero{position:relative;}

  /* ---------- modo edición (panel) ---------- */
  body.editing [data-k]{outline:1px dashed transparent; outline-offset:2px; cursor:text; border-radius:2px;}
  body.editing [data-k]:hover{outline-color:color-mix(in srgb, var(--ember) 70%, transparent);}
  body.editing [data-k]:focus{outline:2px solid var(--ember); background:color-mix(in srgb, var(--ember) 10%, transparent);}
  body.editing .hero-media{cursor:pointer;}

  /* ---------- responsive ---------- */
  @media (max-width:880px){
    nav{
      position:fixed; top:0; right:0; height:100vh; height:100dvh; width:72vw; max-width:320px;
      background:var(--ink); color:var(--paper); flex-direction:column; justify-content:center; gap:30px; padding:0 40px;
      transform:translateX(100%); transition:transform .7s var(--ease-out);
    }
    nav.open{transform:translateX(0);}
    nav a{font-size:1.6rem; font-weight:500; padding:6px 0;}
    .nav-toggle{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; width:44px; height:44px; margin-right:-10px;
      cursor:pointer; background:none; border:none; padding:6px; z-index:60; color:inherit;}
    .nav-toggle span{width:22px; height:2px; background:currentColor; transition:transform .3s ease, opacity .3s ease;}
    body.menu-open .nav-toggle{color:var(--paper);}
    body.menu-open .nav-toggle span:nth-child(1){transform:translateY(7px) rotate(45deg);}
    body.menu-open .nav-toggle span:nth-child(2){opacity:0;}
    body.menu-open .nav-toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
    body.menu-open{overflow:hidden;}
    .nav-backdrop{display:block; position:fixed; inset:0; z-index:40; background:rgba(21,20,15,.5); opacity:0; pointer-events:none; transition:opacity .6s var(--ease);}
    body.menu-open .nav-backdrop{opacity:1; pointer-events:auto;}
    .about,.contact-grid{grid-template-columns:1fr; gap:28px;}
    .contact-grid{gap:50px;}
    .gallery-grid{grid-template-columns:repeat(min(var(--cols), 2), 1fr); gap:calc(18px * var(--gap));}
    section{padding:calc(80px * var(--py,1)) 6vw;}
  }
  /* celular: Trabajos de a una foto grande, deslizando de costado */
  @media (max-width:700px) and (hover:none){
    .gallery-grid,.gallery-grid.carousel{
      display:flex; position:relative; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain;
      gap:12px; margin:0 -20px; padding:0 20px 4px; scroll-padding:0 20px;
    }
    .gallery-grid::-webkit-scrollbar{display:none;}
    .gallery-grid figure,.gallery-grid.carousel figure{flex:0 0 calc(100% - 24px); scroll-snap-align:center; scroll-snap-stop:always;}
    .gallery-grid figcaption{margin-top:12px; flex-direction:row; align-items:center;}
    .thumb{width:36px; height:36px;}
    .gal-dots{display:flex; justify-content:center; gap:6px; margin-top:20px;}
    .gal-dots span{width:6px; height:6px; border-radius:6px; background:var(--line); transition:width .6s var(--ease-out), background .6s var(--ease);}
    .gal-dots span.on{width:20px; background:var(--ink);}
  }
  .gal-dots:empty{display:none;}
  @media (max-width:560px){
    header{padding:14px 20px;}
    header.solid{padding:10px 20px;}
    section{padding:calc(64px * var(--py,1)) 20px;}
    .section-head{gap:12px; margin-bottom:16px;}
    .services-line{margin-bottom:28px; font-size:1rem;}
    .hero{min-height:520px;}
    .hero-content{padding:0 20px calc(110px * var(--py,1));}
    .hero h1{font-size:2.4rem;}
    .hero p{font-size:1rem; margin-top:16px;}
    .cta{display:flex; justify-content:center; width:100%; padding:16px;}
    .about-text p{font-size:1rem; line-height:1.7;}
    .contact p.lead{font-size:1.12rem;}
    .contact .section-head{margin-bottom:32px;}
    .contact-list li{flex-direction:column; gap:4px; padding:16px 0;}
    footer{flex-direction:column; align-items:flex-start; padding:24px 20px calc(90px + env(safe-area-inset-bottom));}
    .filters{flex-wrap:nowrap; overflow-x:auto; margin:0 -20px 24px; padding:0 20px 4px; scrollbar-width:none;}
    .filters::-webkit-scrollbar{display:none;}
    .chip{padding:10px 16px;}
    .lb-btn{display:none;}
    .wa-float{
      display:flex; align-items:center; justify-content:center;
      position:fixed; left:16px; right:16px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:45;
      height:52px; background:var(--ember); color:var(--paper); font-size:.92rem; font-weight:500; letter-spacing:.02em;
      box-shadow:0 8px 24px rgba(0,0,0,.25); transform:translateY(140%); transition:transform .8s var(--ease-out);
    }
    .wa-float.show{transform:none;}
  }
  /* compu con ventana angosta: igual que antes */
  @media (max-width:560px) and (hover:hover){
    .gallery-grid.carousel{margin:0 -20px; padding:0 20px 8px; gap:14px;}
    .gallery-grid.carousel figure{flex:0 0 82%; scroll-snap-align:center;}
    .gallery-grid:not(.carousel){gap:14px;}
    .gallery-grid:not(.carousel) figcaption{margin-top:8px; flex-direction:column; align-items:flex-start; gap:8px;}
    .thumb{width:28px; height:28px;}
  }
  /* "reducir movimiento" del sistema: sin desplazamientos ni zoom, pero con fundidos suaves */
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .reveal,.hero-content .reveal,.reveal.words .wi,.intro-title,.intro-btn,.intro.leave .intro-in{transform:none !important;}
    .reveal.words{opacity:0; transition:opacity 1.4s var(--ease-io) var(--d,0s);}
    .reveal.words.in{opacity:1;}
    .reveal.words .wi{transition:none;}
    .reveal,.work.img-reveal .frame,.intro-title{filter:none !important;}
    .work.img-reveal .slides{scale:1 !important;}
    .section-head .rule{transform:none !important;}
    .hero-img.on,.hero-img.off{animation:none;}
    .work.pop{animation-name:fadeIn;}
    .work:hover .slides img{transform:none;}
  }
</style>
